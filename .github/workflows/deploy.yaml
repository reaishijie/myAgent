name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: fc
        type: choice
        options:
          - fc
          - cloudflare

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'fc' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'fc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'fc' }}
      BUN_LAYER_ARN: ${{ secrets.BUN_LAYER_ARN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      OPENAI_CHAT_API_KEY: ${{ secrets.OPENAI_CHAT_API_KEY }}
      OPENAI_CHAT_BASE_URL: ${{ secrets.OPENAI_CHAT_BASE_URL }}
      OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
      OPENAI_EMBEDDING_API_KEY: ${{ secrets.OPENAI_EMBEDDING_API_KEY }}
      OPENAI_EMBEDDING_BASE_URL: ${{ secrets.OPENAI_EMBEDDING_BASE_URL }}
      OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
      RAG_CHUNK_SIZE: ${{ secrets.RAG_CHUNK_SIZE }}
      RAG_CHUNK_OVERLAP: ${{ secrets.RAG_CHUNK_OVERLAP }}
      RAG_TOP_K: ${{ secrets.RAG_TOP_K }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: backend

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: backend

      - name: Run tests
        run: bun test
        working-directory: backend

      - name: Build FC bundle
        if: env.DEPLOY_TARGET == 'fc'
        run: bun run build:fc
        working-directory: backend

      - name: Install Serverless Devs
        if: env.DEPLOY_TARGET == 'fc'
        run: npm install -g @serverless-devs/s

      - name: Configure Alibaba Cloud credentials
        if: env.DEPLOY_TARGET == 'fc'
        run: |
          s config add \
            -a default \
            --AccessKeyID "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --AccessKeySecret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --AccountID "${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}" \
            -f

      - name: Deploy to Alibaba Cloud FC
        if: env.DEPLOY_TARGET == 'fc'
        run: s deploy -y
        working-directory: backend

      - name: Configure Cloudflare runtime secrets
        if: env.DEPLOY_TARGET == 'cloudflare'
        working-directory: backend
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf "%s" "$value" | bunx wrangler secret put "$name"
            else
              echo "Skip empty Cloudflare secret: $name"
            fi
          }

          put_secret DATABASE_URL
          put_secret ADMIN_API_KEY
          put_secret OPENAI_CHAT_API_KEY
          put_secret OPENAI_CHAT_BASE_URL
          put_secret OPENAI_CHAT_MODEL
          put_secret OPENAI_EMBEDDING_API_KEY
          put_secret OPENAI_EMBEDDING_BASE_URL
          put_secret OPENAI_EMBEDDING_MODEL
          put_secret RAG_CHUNK_SIZE
          put_secret RAG_CHUNK_OVERLAP
          put_secret RAG_TOP_K

      - name: Deploy to Cloudflare Workers
        if: env.DEPLOY_TARGET == 'cloudflare'
        run: bun run deploy:cf
        working-directory: backend
